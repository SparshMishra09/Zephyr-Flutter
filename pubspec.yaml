name: zephyr
description: Zephyr - Your AI-powered on-device research assistant with RAG.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # AI / ML
  google_generative_ai: ^0.4.3
  tensorflow_lite_flutter: ^0.2.0

  # File handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  pdf: ^3.10.8
  csv: ^5.1.1
  image: ^4.1.7

  # Networking
  http: ^1.2.0

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  pull_to_refresh: ^2.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0

  # Permissions
  permission_handler: ^11.2.0

  # System overlay (ghost bubble)
  system_alert_window: ^1.0.6
  overlay_support: ^1.2.0

  # Utilities
  uuid: ^4.3.3
  collection: ^1.18.0
  math: ^0.0.0
  intl: ^0.19.0
  logging: ^1.2.0
  equatable: ^2.0.5

  # Vector math
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/models/

  fonts:
    - family: ZephyrIcons
      fonts:
        - asset: assets/fonts/ZephyrIcons.ttf